# Gemini CLI Policy Engine — per-call READ-ONLY policy for the gemini leg.
# Attached via `--policy <this file>` when the wrapper is run with
# `--sandbox read-only`. Allows read tools, denies mutation + shell tools.
# Used INSTEAD of `--approval-mode plan` (plan mode crashes the Node/V8 heap on
# heavy files — gemini-cli issues #11321 / #18331 / #26588). It is per-call, so
# the same leg still does code work under `--sandbox workspace-write`.
#
# Schema DOC-VERIFIED 2026-07-04 against geminicli.com/docs/reference/policy-engine
# (rule table: toolName / decision allow|deny / priority; highest priority wins,
# so the deny rules (200) override the allow rules (100)). `--policy` loads at
# the User tier (4) and REPLACES ~/.gemini/policies for this call; only an
# Admin-tier policy can outrank these denies (gemini-cli PR #18500).
# `--policy` REPLACES only the USER-tier policy directory for this call (verified
# 2026-09-19 against packages/core/src/policy/config.ts at v0.46.0 and v0.60.0);
# system/admin, workspace and the built-in DEFAULT policies still load, so a tool
# this file does not name keeps the default tier's decision. Live ENFORCEMENT of
# the deny rows is verified where gemini is in service (CLI login, no API keys):
# the shared spec's `contracts/gemini-readonly.verify.toml` lists the checks and
# the owner briefs the result (spec R-GOOGLE / Q-N). D-9 web rows: see the end.

# --- allow read tools ---
[[rule]]
toolName = "read_file"
decision = "allow"
priority = 100

[[rule]]
toolName = "read_many_files"
decision = "allow"
priority = 100

[[rule]]
toolName = "glob"
decision = "allow"
priority = 100

[[rule]]
toolName = "search_file_content"
decision = "allow"
priority = 100

[[rule]]
toolName = "list_directory"
decision = "allow"
priority = 100

# --- deny mutation + shell tools (higher priority) ---
[[rule]]
toolName = "write_file"
decision = "deny"
priority = 200

[[rule]]
toolName = "replace"
decision = "deny"
priority = 200

[[rule]]
toolName = "run_shell_command"
decision = "deny"
priority = 200

# --- defense-in-depth: deny MCP-server tools (read-only must not depend on
# headless ask_user->deny defaults for unlisted tools). Wildcard is DOCUMENTED:
# policy-engine reference — "mcp_*: Matches any tool from any MCP server"
# (geminicli.com/docs/reference/policy-engine, verified 2026-07-05). ---
[[rule]]
toolName = "mcp_*"
decision = "deny"
priority = 200

# --- D-9 (owner ruling 2026-09-19): review legs have no web tools. EXPLICIT rows,
# because `--policy` replaces only the USER tier and the built-in default tier
# still loads: v0.60.0 `read-only.toml` allows google_web_search at priority 50
# and `write.toml:96-108` denies web_fetch only in headless runs, so a tool this
# file did not name kept the default decision (round r2 finding). Web evidence
# belongs to an investigation dispatch (shared spec R-INVEST, clause web-evidence).
# Runtime effect verified where gemini is in service — checklist
# `contracts/gemini-readonly.verify.toml` in the shared spec (owner briefing route). ---
[[rule]]
toolName = ["google_web_search", "web_fetch"]
decision = "deny"
priority = 200
denyMessage = "Review legs read the reviewed tree only; web evidence belongs to an investigation dispatch (D-9)."
